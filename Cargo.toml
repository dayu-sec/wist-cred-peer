[package]
name = "wist-cred-peer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Verifier-side (X) runtime for wist-cred: receive credential digests over mutual TLS and keep their own state"
repository = "https://github.com/dayu-sec/wist-cred-peer"
readme = "README.md"
keywords = ["credential", "mtls", "axum", "verification"]
categories = ["authentication", "web-programming"]
exclude = [".github/**", "target/**"]

[lib]
name = "wist_cred_peer"
path = "src/lib.rs"

[[example]]
name = "peer-service"

[dependencies]
anyhow = "1"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# 摘要表、裁剪、错误码都在验证侧实现里，不在这里另写一套。
wist-auth = { version = "0.2", features = ["credential"] }
# 握手期的双向认证与「这张客户端证书是谁」。
wist-pki = "0.1.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-rustls = "0.26"
# hyper 的 service_fn 要一个 Service；axum 的 Router 本身就实现了它。
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
