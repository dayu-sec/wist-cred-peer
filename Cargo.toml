[package]
name = "wist-cred-peer"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Verifier-side (X) runtime for wist-cred: receive credential digests over mutual TLS and keep their own state"
repository = "https://github.com/dayu-sec/wist-cred-peer"
readme = "README.md"
keywords = ["credential", "mtls", "axum", "verification"]
categories = ["authentication", "web-programming"]
exclude = [".github/**", "target/**"]

[lib]
name = "wist_cred_peer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# 摘要表、裁剪、错误码都在验证侧实现里，不在这里另写一套。
# `signing`：授权记录的 Ed25519 验签（收到时 + 从磁盘加载时）。
wist-auth = { version = "0.3", features = ["credential", "signing"] }
# 握手期的双向认证与「这张客户端证书是谁」。
wist-pki = "0.1.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 计算对端（入口）证书指纹：初始化页要把“我连到的到底是谁”摆给操作者核对。
ring = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tokio-rustls = "0.26"
# hyper 的 service_fn 要一个 Service；axum 的 Router 本身就实现了它。
tower = { version = "0.5", features = ["util"] }

# 自注册（初始化页）：本机生成密钥与 CSR。与 wist-pki 同一套原语。
rcgen = { version = "0.13", features = ["pem"] }
# 校验证书 SAN：必须含本机上报的主机名，否则 cred 连过来时握手必然失败。
x509-parser = "0.16"
# 调 cred 的 /enroll/{券}/{bundle,certificate}。
# rustls 而不是 openssl：与镜像里的 `ubuntu:24.04` 不绑系统库。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
http-body-util = "0.1"
